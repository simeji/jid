name: VirusTotal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to scan (e.g. v1.1.3). Leave blank for latest release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  virustotal:
    name: VirusTotal Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check VirusTotal API Key
        id: check-key
        run: |
          if [ -z "${{ secrets.VT_API_KEY }}" ]; then
            echo "VT_API_KEY secret is not set. Skipping VirusTotal scan."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Release Tag
        if: steps.check-key.outputs.skip != 'true'
        id: target
        run: |
          TAG="${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Submit Release Assets to VirusTotal
        if: steps.check-key.outputs.skip != 'true'
        uses: cssnr/virustotal-action@v2
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_id: ${{ steps.target.outputs.tag }}
